services:

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    networks:
      - frontend_network
    depends_on:
      backend:
        condition: service_healthy

  backend:
    build: ./backend
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: app
      DB_NAME: myapp
      DB_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    networks:
      - frontend_network
      - backend_network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:5000 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 3s

  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: app
      POSTGRES_DB: myapp
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    networks:
      - backend_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d myapp"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  frontend_network:
    driver: bridge
  backend_network:
    driver: bridge

secrets:
  postgres_password:
    file: ./secrets/postgres_password.txt
